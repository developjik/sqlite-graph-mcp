# Publishes the server metadata to the official MCP Registry
# (registry.modelcontextprotocol.io) on every version tag. Authentication uses
# GitHub OIDC — no registry secrets. The npm package itself is published
# separately (from a maintainer machine); mcp-publisher verifies that the npm
# package's mcpName matches this server.json before publishing.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc


      - name: Wait for the npm release to propagate
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if npm view @developjik/sqlite-graph-mcp@${GITHUB_REF_NAME#v} version >/dev/null 2>&1; then
              echo "npm has ${GITHUB_REF_NAME#v}"
              exit 0
            fi
            echo "waiting for npm to list ${GITHUB_REF_NAME#v} ($i/30)"
            sleep 10
          done
          echo "npm never listed the release; publishing will likely fail" >&2

      - name: Publish server to MCP Registry
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "publish attempt $i failed; retrying in 30s" >&2
            sleep 30
          done
          ./mcp-publisher publish
