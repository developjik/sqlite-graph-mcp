name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: CLI smoke test
        run: |
          node dist/bin/cli.js index test/fixtures/ws --db "$RUNNER_TEMP/graph.db" --json
          node dist/bin/cli.js find walkGraph --db "$RUNNER_TEMP/graph.db" --json
          node dist/bin/cli.js plan 'find "walker" kind=symbol | walk type=defines dir=in depth=1' --db "$RUNNER_TEMP/graph.db"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
