# Creates the GitHub Release for every version tag, using that version's
# CHANGELOG.md section as the body. The tag must match package.json,
# server.json and CHANGELOG.md (scripts/check-version-sync.mjs) or no Release
# is created.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - name: Check versions and extract release notes
        run: node scripts/check-version-sync.mjs --tag "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/notes.md"
      - name: Append changelog link
        run: printf '\nFull changelog: %s/%s/blob/main/CHANGELOG.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
